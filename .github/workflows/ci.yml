name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openbook
      CLIENT_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci_better_auth_secret_32_chars_min
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      # Optional locally: npm run lint --prefix client (existing debt — see CONTRIBUTING.md)

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openbook
      CLIENT_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci_better_auth_secret_32_chars_min
      BETTER_AUTH_URL: http://localhost:8081
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma db push
        working-directory: server
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: true
